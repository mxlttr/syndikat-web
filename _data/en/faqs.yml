- question: What is disc golf?
  answer: Disc golf is a precision sport similar to traditional golf, but played with a specially designed flying disc instead of a ball. Just like in classic golf, there are drivers and putters. The aim of the game is to throw the disc into a basket.

- question: What is a disc golf club?
  answer: A disc golf club is a group of disc golf enthusiasts who have come together to drive the development and promotion of the sport in their city. The club organises disc golf events, builds and maintains new courses and offers courses for beginners and advanced players.

- question: How can I become a member of the disc golf club?
  answer: To become a member of the disc golf club, get in touch with the club and <a href="/en/register/">sign up for a membership</a>. We also have a Discord server where we regularly chat with each other. Membership can come with various benefits, such as discounts in disc golf shops, access to tournaments and much more.

- question: How do I find disc golf courses near me?
  answer: You can find disc golf courses near you on websites such as <a href="https://udisc.com" target="_blank" rel="noopener noreferrer">UDisc.com</a> or <a href="https://www.pdga.com/course-directory" target="_blank" rel="noopener noreferrer">PDGA.com</a>. You can also contact your local disc golf club and get information about the courses in your area.

- question: Do I need to bring my own equipment to play disc golf?
  answer: With a bit of luck, players on site will lend you a few discs, or there is a rental option on site. However, if you want to play often, it is a good idea to buy your own discs, new or used. Some disc golf clubs also offer members discounts on discs and other equipment.

- question: Can I play disc golf alone or do I need a group?
  answer: You can play disc golf on your own or in a group. Some players prefer to play alone, while others prefer to play in groups. It all depends on your personal preferences.

- question: How long does a round of disc golf take?
  answer: The length of a disc golf round depends on various factors, such as the number of players, the size of the course and the difficulty of the holes. In general, a round takes one to two hours.

- question: Can I play disc golf as a beginner?
  answer: Yes, anyone can play disc golf, regardless of age or experience. Many disc golf courses have layouts for beginners and advanced players, and there are often experienced players who are happy to support beginners and give tips.

- question: How can I take part in disc golf tournaments?
  answer: You can take part in disc golf tournaments by registering on the organiser's website. Some tournaments have special qualification requirements, while others are open to everyone.

- question: How can I learn more about disc golf?
  answer: "There are many ways to learn more about disc golf, including:"
  list:
    - Visit a disc golf course and play a round with experienced players who are happy to give you tips.
    - Watch videos on YouTube to learn different techniques and strategies. We recommend the <a href="https://www.youtube.com/channel/UCmGyCEbHfY91NFwHgioNLMQ" target="_blank" rel="noopener noreferrer">Jomez</a> channel.
    - Visit online forums and blog posts to exchange ideas with other players and get information.
    - Join a disc golf club and take part in training sessions and events.
    - Watch live broadcasts of professional disc golf tournaments on YouTube (<a href="https://www.youtube.com/discgolfprotour" rel="noopener noreferrer" target="_blank">Disc Golf Network</a>) to learn from the best.
