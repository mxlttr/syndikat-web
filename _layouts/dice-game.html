---
layout: default
---

<div class="page-head">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="page__info">
          <h1 class="page__title">{{- page.title -}}</h1>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container animate">
  <div class="page">
    <div class="page__content">
      <div class="dice-wrapper">
        <p>{{ 'dice_game.intro' | t }}</p>
        <div class="dice">
          <div class="die">🎲</div>
          <div class="die">🎲</div>
        </div>

        <button class="button button--primary" data-umami-event="dice_roll" data-roll-dice>{{ 'dice_game.roll' | t }}</button>
      </div>

      <div>
        {{ content }}
      </div>
    </div>
  </div>
</div>
