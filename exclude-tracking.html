---
permalink: /tracking-ignore.html
layout: default
noindex: true
---

<div class="container">
  <form action="" class="form" data-tracking-form>
    <label class="form__title">Tracking</label>
    <div class="form__group form__group--radio">
      <label class="form__label form__checkbox-group">
        <input class="form__input no-cache" id="tracking-enable" type="radio" value="false" name="tracking">
        Enable
      </label>
      <label class="form__label form__checkbox-group">
        <input class="form__input no-cache" id="tracking-disable" type="radio" value="true" name="tracking">
        Disable
      </label>
    </div>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('[data-tracking-form] input');
    const storedPreference = localStorage.getItem('umami.disabled') === '1';
    const isSyndikatHost = location.hostname === 'syndikat.golf' || location.hostname.endsWith('.syndikat.golf');
    const cookieDomain = isSyndikatHost ? '; Domain=.syndikat.golf' : '';
    const setCookie = disabled => {
      const value = disabled ? '1' : '0';
      document.cookie = `syndikat_analytics_disabled=${value}; Path=/; Max-Age=${disabled ? 31536000 : 0}; SameSite=Lax${cookieDomain}${location.protocol === 'https:' ? '; Secure' : ''}`;
    };
    setCookie(storedPreference);

    inputs.forEach(input => {
      input.checked = (input.value === 'true') === storedPreference;
      input.addEventListener('change', event => {
        const isTrackingDisabled = event.target.value === 'true';
        if (isTrackingDisabled) {
          localStorage.setItem('umami.disabled', '1');
          setCookie(true);
          return;
        }

        localStorage.removeItem('umami.disabled');
        setCookie(false);
      });
    });
  });
</script>
